qlib_init:
    provider_uri: "~/.qlib/qlib_data/soy_continuous"
    region: us

market: &market all  
benchmark: &benchmark HP_CME_SOY

data_handler_config: &data_handler_config
    start_time: 2002-01-01
    end_time: 2025-01-01
    fit_start_time: 2002-01-01
    fit_end_time: 2016-12-31
    instruments: *market
    infer_processors:
        - class: FilterCol
          kwargs:
              fields_group: feature
              col_list: ["RESI5", "WVMA5", "RSQR5", "KLEN", "RSQR10", "CORR5", "CORD5", "CORR10", 
                            "ROC60", "RESI10", "VSTD5", "RSQR60", "CORR60", "WVMA60", "STD5", 
                            "RSQR20", "CORD60", "CORD10", "CORR20", "KLOW"
                        ]
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
              fit_start_time: 2003-01-01
              fit_end_time: 2016-12-31
        - class: Fillna
          kwargs:
              fields_group: feature
    # learn_processors:
    #   - class: DropnaLabel
    #   - class: RobustZScoreNorm
    #     kwargs:
    #       fields_group: feature
    #       clip_outlier: true
    #       fit_start_time: 2002-01-01
    #       fit_end_time: 2016-12-31
    #   - class: Fillna
    #     kwargs:
    #       fields_group: feature
    learn_processors:
      - class: DropnaLabel         
      - class: Fillna           
        kwargs:
          fields_group: feature
    label: ["Ref($close, -8) / Ref($close, -1) - 1"] 

port_analysis_config: &port_analysis_config
    strategy:
        # class: SingleAssetThresholdStrategy
        # module_path: rdagent.scenarios.qlib.strategy.single_asset
        # kwargs:
        #     signal: <PRED>         # 和原来 TopkDropoutStrategy 一致
        #     long_threshold: 0.0    # 你可以后面再调
        #     short_threshold: null  # 暂时不做空
        #     long_weight: 1.0
        #     short_weight: -1.0
        #     flat_weight: 0.0
        #     allow_short: false
        class: SingleAssetSmoothQuantileStrategy
        module_path: rdagent.scenarios.qlib.strategy.single_asset  # 改成你保存这个类的 python 路径
        kwargs:
          signal: <PRED>

          # 分位数阈值：越接近 0.5，越“宽松”；越靠近 0/1，越“极端”
          high_quantile: 0.7
          low_quantile: 0.3
          quantile_history_window: 60
          min_history: 30

          # 信号平滑：3 天滚动均值是一个比较温和的选择
          smooth_window: 3

          # 权重映射
          max_long_weight: 1.0
          max_short_weight: -1.0
          tanh_scale: 3.0

          # 先按你实际需求设置是否允许做空
          allow_short: True   # 或 True
    backtest:
        start_time: 2019-01-01
        end_time: 2025-01-01
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.5
            deal_price: close
            open_cost: 0
            close_cost: 0
            min_cost: 0
task:
    model:
        class: LGBModelWithFeatLog
        module_path: rdagent.scenarios.qlib.model.logging_lgbm
        kwargs:
          loss: mse

          # —— 控模型复杂度 —— 
          num_leaves: 31          # 从 63 降到 31，树变浅一点
          min_data_in_leaf: 40    # 比 50 稍微放松，但仍然比较保守
          max_depth: -1           # 由 num_leaves 控制复杂度

          # —— 学习率 & 轮数 —— 
          learning_rate: 0.02     # 从 0.05 降到 0.02，让模型慢慢学，多给几轮发挥空间

          # —— 随机性 & 正则 —— 
          colsample_bytree: 0.8   # feature_fraction
          subsample: 0.8          # bagging_fraction
          lambda_l1: 0.0
          lambda_l2: 5.0          # 轻微 L2 正则
          # 也可以视情况增加到 10 左右
          num_threads: 20
    # model:
    #   class: LinearModel
    #   module_path: qlib.contrib.model.linear
    #   kwargs:
    #     estimator: "ridge"
    #     alpha: 0.05
    #     fit_intercept: true
    #     include_valid: false
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2003-01-01, 2016-12-31]
                valid: [2017-01-01, 2018-12-31]
                test:  [2019-01-01, 2025-01-01]
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
        - class: TSSigAnaRecord
          module_path: rdagent.scenarios.qlib.record.TSSignalRecord
          kwargs: 
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config
