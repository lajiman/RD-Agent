    infer_processors:
      - class: RobustZScoreNorm
        kwargs:
          fields_group: feature
          clip_outlier: true
          fit_start_time: 2003-01-01
          fit_end_time: 2016-12-31
      - class: Fillna
        kwargs:
          fields_group: feature
