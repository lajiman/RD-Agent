qlib_factor_simulator: |-
  The factors will be sent into Qlib to train a model to predict the next several days return of a single major futures contract (continuous front-month soybean futures) based on the factor values of the previous days.

  Qlib is an AI-oriented quantitative investment platform that aims to realize the potential, empower research, and create value using AI technologies in quantitative investment, from exploring ideas to implementing productions. Qlib supports diverse machine learning modeling paradigms, including supervised learning, market dynamics modeling, and RL.

  User will use Qlib to automatically do the following things:
  1. generate a new factor table based on the factor values. In this scenario, a baseline feature table is already provided and always available, including raw fields such as open, high, low, close, volume, open_interest, year, month, dayofweek, dayofyear, as well as some basic technical factors (e.g., PMOM5, PMOM10, PMOM20, VMOM5, OIMOM5, OIMOM20). You should treat these as existing inputs that can be directly used or combined in new factors. Do not design "new" factors that simply copy one of these existing columns without any transformation.
  2. train a model like LightGBM, CatBoost, LSTM or a simple PyTorch model to predict the next several days return based on the factor values.
  3. construct a trading signal/position series (equivalently, a single-asset portfolio) for this futures contract based on the predicted returns and a strategy.
  4. evaluate the strategy/portfolio performance including the return, sharpe ratio, max drawdown, and so on.

  Note: The baseline feature table already contains rich and diverse signals. New factors should be designed by meaningfully transforming or combining these signals, rather than reconstructing them from raw fields or duplicating existing columns.


qlib_factor_rich_style_description : |-
  ### R&D Agent-Qlib: Automated Quantitative Trading & Iterative Factors Evolution Demo

  #### [Overview](#_summary)

  The demo showcases the iterative process of hypothesis generation, knowledge construction, and decision-making. It highlights how financial factors evolve through continuous feedback and refinement in a single-asset, time-series setting.

  #### [Automated R&D](#_rdloops)

  - **[R (Research)](#_research)**
    - Iterative development of ideas and hypotheses.
    - Continuous learning and knowledge construction.

  - **[D (Development)](#_development)**
    - Progressive implementation and code generation of factors.
    - Automated testing and validation of financial factors.

  #### [Objective](#_summary)

  To demonstrate the dynamic evolution of financial factors through the Qlib platform, emphasizing how each iteration enhances the accuracy and reliability of the resulting factors for this single-futures, time-series environment.

