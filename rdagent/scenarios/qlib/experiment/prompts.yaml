  {{ runtime_environment }}
  {% endif %}


qlib_factor_interface: |-
  Your python code should follow the interface to better interact with the user's system.
  Your python code should contain the following parts: the import part, the function part, and the main part. You should write a main function named "calculate_{function_name}" and call this function in the "if __name__ == '__main__'" part. Don't write any try-except block in your python code. The user will catch the exception message and provide the feedback to you.

  The user will write your python code into a python file and execute the file directly with "python {your_file_name}.py". You should calculate the factor values and save the result into a HDF5 (H5) file named "result.h5" in the same directory as your python file. The result file is a HDF5 (H5) file containing a pandas DataFrame. The index of the DataFrame is the "datetime" and "instrument", and the single column name is the factor name, and the value is the factor value. Even though the current scenario uses a single major futures contract, you must still follow this interface and keep both "datetime" and "instrument" as the index. The result file should be saved in the same directory as your python file.
  Note: In the input DataFrame, all baseline feature columns use a prefix "$", such as "$close", "$volume", "$RESI5". When accessing any column in code, always use df['$COLUMN_NAME'] exactly as it appears in df.columns. For example, use df['$RESI5'], not df['RESI5'].


qlib_factor_strategy: |-
  Ensure that for every step of data processing, the data format (including indexes) is clearly explained through comments.
  Each transformation or calculation should be accompanied by a detailed description of how the data is structured, especially focusing on key aspects like whether the data has multi-level indexing, how to access specific columns or index levels, and any operations that affect the data shape (e.g., `reset_index()`, `groupby()`, `merge()`). When referencing columns in the DataFrame, always use the exact names in `df.columns`.

  This step-by-step explanation will ensure clarity and accuracy in data handling. For example:
  1. **Start with multi-level index**:  
    ```python
    # The initial DataFrame has a multi-level index with 'datetime' and 'instrument'.
    # To access the 'datetime' index, use df.index.get_level_values('datetime').
    datetime_values = df.index.get_level_values('datetime')
    ```
 
  2. **Reset the index if necessary**:  
    ```python
    # Resetting the index to move 'datetime' and 'instrument' from the index to columns.
    # This operation flattens the multi-index structure.
    df = df.reset_index()
    ```
 
  3. **Perform groupby operations**:  
    ```python
    # Grouping by 'datetime' and 'instrument' to aggregate the data.
    # After groupby, the result will maintain 'datetime' and 'instrument' as a multi-level index.
    df_grouped = df.groupby(['datetime', 'instrument']).sum()
    ```
 
  4. **Ensure consistent datetime formats**:  
    ```python
    # Before merging, ensure that the 'datetime' column in both DataFrames is of the same format.
    # Convert to datetime format if necessary.
    df['datetime'] = pd.to_datetime(df['datetime'])
    other_df['datetime'] = pd.to_datetime(other_df['datetime'])
    ```
 
  5. **Merge operations**:  
    ```python
    # When merging DataFrames, ensure you are merging on both 'datetime' and 'instrument'.
    # If these are part of the index, reset the index before merging.
    merged_df = pd.merge(df, other_df, on=['datetime', 'instrument'], how='inner')
    ```

