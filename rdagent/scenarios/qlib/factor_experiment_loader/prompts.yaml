extract_factors_system: |-
    用户会提供一篇金融工程研报，其中包括了量化因子和模型研究，请按照要求抽取以下信息:
    1. 概述这篇研报的主要研究思路;
    2. 抽取出所有的因子，并概述因子的计算过程，请注意有些因子可能存在于表格中，请不要遗漏，因子的名称请使用英文，不能包含空格，可用下划线连接，研报中可能不含有因子，若没有请返回空字典;
    3. 抽取研报里面的所有模型，并概述模型的计算过程，可以分步骤描述模型搭建或计算的过程，研报中可能不含有模型，若没有请返回空字典;

    user will treat your factor name as key to store the factor, don't put any interaction message in the content. Just response the output without any interaction and explanation.
    All names should be in English.
    Respond with your analysis in JSON format. The JSON schema should include:
    {
        "summary": "The summary of this report",
        "factors": {
            "Name of factor 1": "Description to factor 1",
            "Name of factor 2": "Description to factor 2"
        },
        "models": {
            "Name of model 1": "Description to model 1",
            "Name of model 2": "Description to model 2"
        }
    }

extract_factors_follow_user: |-
    Please continue extracting the factors. Please ignore factors appeared in former messages. If no factor is found, please return an empty dict.
    Notice: You should not miss any factor in the report! Some factors might appear several times in the report. You can repeat them to avoid missing other factors.
    Respond with your analysis in JSON format. The JSON schema should include:
    {
        "factors": {
            "Name of factor 1": "Description to factor 1",
            "Name of factor 2": "Description to factor 2"
        }
    }

extract_factor_formulation_system: |-
    I have a financial engineering research report and a list of factors extracted from it. I need assistance in extracting specific information based on the report and the provided list of factors. The tasks are as follows:

    1. For each factor, I need its calculation formula in LaTeX format. The variable names within the formulas should not contain spaces; instead, use underscores to connect words. Ensure that the factor names within the formulas are consistent with the ones I've provided.
    2. For each factor formula, provide explanations for the variables and functions used. The explanations should be in English, and the variable and function names should match those used in the formulas.

    Here are the sources of data I have:

    1. Futures Trade Data Table:
        - Daily or higher-frequency prices (open, close, high, low, VWAP), volume, turnover for listed instruments, and time information.
        Available daily fields for soybean futures (HP_CME_SOY):
            - open: Daily open price of the futures contract.
            - high: Daily highest traded price.
            - low: Daily lowest traded price.
            - close: Daily settlement or last traded price used as close.
            - volume: Daily trading volume (number of contracts traded).
            - open_interest: Number of open futures contracts at the end of the day.
            - year: Calendar year of the trading date.
            - month: Calendar month of the trading date (1–12).
            - dayofweek: Day of week of the trading date (0=Monday,...,4=Friday).
            - dayofyear: Ordinal day index within the year (1–366).

    2. Financial Data Table:
        - Company-level or underlying-asset-level financial statements, such as the balance sheet, income statement, and cash flow statement (e.g., earnings, assets, liabilities, cash flows).

    3. Fundamental Data Table:
        - Basic information about instruments, such as total shares or contract size, free float, industry or sector classification, market classification, etc.

    Please follow these principles:
    - Reconstruct each factor **as faithfully as possible to the research report**, even if it uses financial or fundamental variables that may not be directly available in the current soybean futures dataset.
    - Whenever possible, prefer using variables that can be naturally mapped to the available soybean futures daily data (open, high, low, close, volume, open_interest, factor, and calendar features).
    - In the variable explanations, clearly indicate the conceptual data source (e.g., “daily futures close price”, “accounting earnings from the financial statement”, “industry classification from the fundamental data table”, “1-minute VWAP from high-frequency data”).

    If the number of factors exceeds the token limit, extract the formulas for as many factors as possible without exceeding the limit. Ensure to avoid syntax errors related to special characters in JSON, especially with backslashes and underscores in LaTeX.

    Provide your analysis in JSON format, using the following schema:
    {
        "factor name 1": {
            "formulation": "latex formulation of factor 1",
            "variables": {
                "variable or function name 1": "description of variable or function 1",
                "variable or function name 2": "description of variable or function 2"
            }
        },
        "factor name 2": {
            "formulation": "latex formulation of factor 2",
            "variables": {
                "variable or function name 1": "description of variable or function 1",
                "variable or function name 2": "description of variable or function 2"
            }
        }
    }


extract_factor_formulation_user: |-
    ===========================Report content:=============================
    {{ report_content }}
    ===========================Factor list in dataframe=============================
    {{ factor_dict }}

classify_system_chinese: |-
    你是一个研报分类助手。用户会输入一篇金融研报。请按照要求回答：
    因子指能够解释资产收益率或价格等的变量；而模型则指机器学习或深度学习模型，利用因子等变量来预测价格或收益率变化。

    请你对研报进行分类，考虑两个条件：
        1. 是金工量化领域中选股（需与择时，选基等严格区分开）方面的研报;
        2. 涉及了因子或模型的构成，或者是测试了它们的表现。
    如果研报同时满足上述两个条件，请输出1；若没有，请输出0。

    请使用json进行回答。json key为：class

classify_system: |-
    Your job is classify whether the user input document is a quantitative investment research report. The user will input a document and you should classify it based on the following conditions:
    1. The document is about finance other than other fields like biology, physics, chemistry, etc.
    2. The document is a quantitative research report involving futures markets, commodity markets, or derivatives (not restricted to stock selection). It may include topics such as factor construction, return prediction, seasonality, roll yield, basis, term structure, or other futures-related models.
    3. The document involves the composition of factors or models, or tests their performance.

    If the document meets all the above conditions, please return 1; otherwise, please return 0.

    Please respond with your decision in JSON format. Just respond the output json string without any interaction and explanation.
    The JSON schema should include:
    {
        "class": 1
    }

factor_viability_system: |-
  User has designed several factors for quantitative futures trading. Please help the user to check the viability of these factors.
  These factors are used to build a daily-frequency strategy in the futures market (specifically soybean futures).

  The user will provide a pandas-dataframe-like table containing:
  1. The name of the factor;
  2. A brief description of the factor;
  3. The formulation of the factor in LaTeX format;
  4. The explanation of variables and functions used in the formulation.

  The available data sources include:

  1. **Soybean Futures Daily Data Table**
     - Fields: open, high, low, close, volume, open_interest, and possibly a precomputed column named factor.

  2. **Calendar Features Derived from the Trade Date**
     - year, month, dayofweek, dayofyear

  A viable futures factor must satisfy:
  1. The factor can be computed at **daily frequency**;
  2. The factor can be computed for the given futures instrument;
  3. The factor can be computed **using only the available data sources** listed above;
  4. The factor does not rely on unavailable data such as stock financial statements, fundamentals, analyst expectations, or corporate-level variables;
  5. The factor does not require cross-sectional data across multiple instruments (since only one instrument is available).

  You should give a decision for each factor provided by the user.  
  A factor should only be rejected if there is a **clear and solid reason** why it cannot be computed with the available data.

  Please return `true` for a viable factor and `false` for a non-viable factor.

  Due to token limits, you may return only part of the factors.  
  Your factor names should match the user's factor names exactly.

  Please respond in JSON format only, without any additional text.  
  The JSON schema should be:

  {
      "Name of factor 1": {
          "viability": true,
          "reason": "Reason explaining why this factor can be computed with available futures data."
      },
      "Name of factor 2": {
          "viability": false,
          "reason": "Reason explaining why this factor cannot be computed with available futures data."
      }
  }


factor_relevance_system: |-
  User has designed several factors for quantitative futures trading. Please help the user check the relevance of these factors as real quantitative factors.
  These factors are used to build a daily-frequency strategy in the futures market (specifically soybean futures).

  The user will provide a pandas-dataframe-like table containing:
  1. The name of the factor;
  2. A simple description of the factor;
  3. The formulation in LaTeX format;
  4. The explanation of variables and functions used.

  A relevant futures factor must satisfy:
  1. The factor can be computed at **daily frequency**;
  2. The factor applies to the given futures instrument;
  3. The factor is based purely on mathematical operations on the available data;
  4. The factor does **not** rely on subjective judgment, qualitative text analysis, discretionary interpretation, or semantic information;
  5. The factor does **not** require unavailable stock-specific data such as financial statements, corporate fundamentals, analyst expectations, or cross-sectional stock features.

  You should give a decision for each factor. A factor should only be rejected with a clear and solid reason.

  Please return `true` for relevant factors and `false` for irrelevant ones.

  Due to token limits, you may return only part of the factors.
  The factor names must match the user's factor names exactly.

  Please respond with JSON only, without explanation outside the JSON object.
  The JSON schema should be:

  {
      "Name of factor 1": {
          "relevance": true,
          "reason": "Reason explaining why this factor is a valid quantitative futures factor."
      },
      "Name of factor 2": {
          "relevance": false,
          "reason": "Reason explaining why this factor is not a valid quantitative futures factor."
      }
  }



factor_duplicate_system: |-
    User has designed several factors in quant investment. Please help the user to duplicate these factors.
    These factors are used to build a daily-frequency strategy in the futures market (for example, soybean futures).

    User will provide a pandas dataframe like table containing following information:
    1. The name of the factor;
    2. The simple description of the factor;
    3. The formulation of the factor in latex format;
    4. The description to the variables and functions in the formulation of the factor.

    User wants to find whether there are duplicated groups. The factors in a duplicate group should satisfy the following conditions:
    1. They might differ in the name, description, formulation, or the description to the variables and functions in the formulation, some upper or lower case difference is included;
    2. They should be talking about exactly the same factor;
    3. If horizon information like 1 day, 5 days, 10 days, etc is provided, the horizon information should be the same.

    To make your response valid, we have some very important constraint for you to follow! Listed here:
    1. You should be very confident to put duplicated factors into a group;
    2. A group should contain at least two factors;
    3. To a factor which has no duplication, don't put them into your response;
    4. To avoid merging too many similar factor, don't put more than ten factors into a group!
    You should always follow the above constraints to make your response valid. 

    Your response JSON schema should include:
    [
        [
            "factor name 1",
            "factor name 2"
        ],
        [
            "factor name 5",
            "factor name 6"
        ],
        [
            "factor name 7",
            "factor name 8",
            "factor name 9"
        ]
    ]
    Your response is a list of lists. Each list represents a duplicate group containing all the factor names in this group. 
    The factor names in the list should be unique and the factor names should be the same as the user's factor name.
    To avoid reaching token limit, don't respond more than fifty groups in one response. You should respond the output json string without any interaction and explanation.